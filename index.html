<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>

    <style>
        body {
            background-color: rgb(13, 11, 11);

        }

        #intro-text {

            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: #b69529a0;
            margin-bottom: 40px;
            font-size: 50px;

        }

        button {
            width: 250px;
            height: 250px;
            background: transparent;
            cursor: pointer;
            padding: 0px;
            border-radius: 100px;
            border: none;


        }

        button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;


        }



        .container {
            display: flex;

            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }

        .buttons-container {
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 60px;

        }


        span,
        .results {
            margin-top: 50px;
            font-size: 40px;
            color: #b69529;

        }

        .score {
            display: flex;
            gap: 80px;
            font-size: 20px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

        }
    </style>
</head>

<body>

    <div class="container">
        <h1 id="intro-text">WELCOME TO ROCK PAPER SCISSORS GAME</h1>

        <div class="buttons-container">
            <button id='rock'><img src="rock.png" alt="Rock"></button>
            <button id='paper'><img src="paper.png" alt="Paper"></button>
            <button id='scissors'><img src="scissors.png" alt="Scissors"></button>
        </div>

        <div class="score">

            <span id="human">You : 0</span>
            <span id="computer">Computer : 0</span>
        </div>

        <div class="results">

        </div>

    </div>







    <script src="script.js"> </script>
</body>

</html>
